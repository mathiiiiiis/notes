name: release

# ==== builds the signed aab that gets uploaded to play ====
# play distributes app bundles, not apks, so the old assembleDebug job could never
# produce anything publishable
#
# required repository secrets:
#   RELEASE_KEYSTORE_BASE64   base64 of your .jks  ->  base64 -w0 release.jks
#   RELEASE_STORE_PASSWORD
#   RELEASE_KEY_ALIAS
#   RELEASE_KEY_PASSWORD

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "version name, for example 1.0.0"
        required: true
      version_code:
        description: "version code, must increase on every play upload"
        required: true

jobs:
  aab:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: set up jdk 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: set up gradle
        uses: gradle/actions/setup-gradle@v4

      - name: make gradlew executable
        run: chmod +x ./gradlew

      - name: decode keystore
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "RELEASE_KEYSTORE_BASE64 is not set" >&2
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: bundle release
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease --no-daemon \
            -PversionName="${{ inputs.version_name }}" \
            -PversionCode="${{ inputs.version_code }}"

      - name: shred keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: upload aab
        uses: actions/upload-artifact@v4
        with:
          name: notes-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: upload mapping
        uses: actions/upload-artifact@v4
        with:
          name: notes-release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
