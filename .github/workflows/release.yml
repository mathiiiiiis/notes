name: release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "version name, for example 1.0.0"
        required: true
      version_code:
        description: "version code, must increase on every play upload"
        required: true
      make_github_release:
        description: "also create a github release with the apk attached"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: set up jdk 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: set up gradle
        uses: gradle/actions/setup-gradle@v4

      - name: make gradlew executable
        run: chmod +x ./gradlew

      - name: decode keystore
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "RELEASE_KEYSTORE_BASE64 is not set" >&2
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: assemble aab and apk
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease assembleRelease --no-daemon \
            -PversionName="${{ inputs.version_name }}" \
            -PversionCode="${{ inputs.version_code }}"

      - name: rename apk
        run: |
          mkdir -p dist
          cp app/build/outputs/bundle/release/app-release.aab \
             "dist/notes-${{ inputs.version_name }}.aab"
          cp app/build/outputs/apk/release/app-release.apk \
             "dist/notes-${{ inputs.version_name }}.apk"
          ls -lh dist

      - name: verify apk signature
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs \
            "dist/notes-${{ inputs.version_name }}.apk"

      - name: shred keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: upload aab
        uses: actions/upload-artifact@v4
        with:
          name: notes-release-aab
          path: dist/*.aab
          if-no-files-found: error

      - name: upload apk
        uses: actions/upload-artifact@v4
        with:
          name: notes-release-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: upload mapping
        uses: actions/upload-artifact@v4
        with:
          name: notes-release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn

      - name: github release
        if: ${{ inputs.make_github_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ inputs.version_name }}" \
            "dist/notes-${{ inputs.version_name }}.apk" \
            --title "v${{ inputs.version_name }}" \
            --generate-notes
